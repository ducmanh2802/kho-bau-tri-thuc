---
name: "3. Browser QA"
description: "Chạy probe Playwright thật trên bản build `dist/` vừa upload"
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      probe:
        description: "Đường dẫn probe trong qa/"
        required: false
        default: "qa/golden-path.mjs"
permissions:
  contents: read
concurrency:
  group: ci-qa-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "true"
jobs:
  qa-smoke:
    name: golden path trên Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Giai đoạn chuyển tiếp: probe QA từng chỉ chạy trên máy dev (đường dẫn Chromium
    # hardcode), nên chưa chắc xanh ổn định trên runner. Job này BÁO LỖI nhưng chưa
    # chặn merge. Xoá dòng `continue-on-error` khi nó xanh liên tiếp vài lần trên main.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # `actions/download-artifact@v4` chỉ thấy artefact của **cùng một workflow run**. Artefact
      # `dist-<sha>` được "2. Build + artifact" upload ở một run khác, nên bước này chưa bao giờ
      # lấy được `dist/` trên runner — job chết ngay đây và `continue-on-error` che thành "success".
      # Build trực tiếp (~1 phút) đánh đổi bằng việc probe thật sự chạy được trên CI.
      - name: Build
        run: npm run build --silent

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: QA probe
        run: node qa/run-one.mjs "${{ github.event.inputs.probe || 'qa/golden-path.mjs' }}"

      # Log của một job Actions chỉ người có quyền admin mới tải được (`GET/…/jobs/<id>/logs` trả
      # `403 Must have admin rights to Repository`), nên lane đã ba lần thấy bước "QA probe" đỏ mà
      # không đọc nổi dòng lỗi. Bước này chạy **sau** khi lỗi, chép 60 dòng cuối vào
      # `$GITHUB_STEP_SUMMARY` — summary của check-run đọc được qua API **không cần quyền**, nên
      # nguyên nhân trở nên quan sát được mà không phải đoán. Không đổi code probe ở đây.
      - name: Chép lỗi probe vào summary (đọc được không cần admin)
        if: failure()
        env:
          PROBE: ${{ github.event.inputs.probe || 'qa/golden-path.mjs' }}
        run: |
          {
            echo "## Probe do: \`$PROBE\`"
            echo "- runner: $(uname -sr) · node $(node -v) · npm $(npm -v)"
            echo "- playwright: $(npx playwright --version 2>&1 || echo khong chay duoc)"
            echo "- dist: $(find dist -maxdepth 1 -type f 2>/dev/null | wc -l) file goc"
            echo '```'
            node qa/run-one.mjs "$PROBE" 2>&1 | tail -60
            echo "exit_cua_lot_chay_nay=${PIPESTATUS[0]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
