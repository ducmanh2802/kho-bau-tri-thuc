---
name: "3. Browser QA"
description: "Chạy probe Playwright thật trên bản build `dist/` vừa upload"
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      probe:
        description: "Đường dẫn probe trong qa/"
        required: false
        default: "qa/golden-path.mjs"
permissions:
  contents: read
concurrency:
  group: ci-qa-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "true"
jobs:
  qa-smoke:
    name: golden path trên Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Giai đoạn chuyển tiếp: probe QA từng chỉ chạy trên máy dev (đường dẫn Chromium
    # hardcode), nên chưa chắc xanh ổn định trên runner. Job này BÁO LỖI nhưng chưa
    # chặn merge. Xoá dòng `continue-on-error` khi nó xanh liên tiếp vài lần trên main.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # `actions/download-artifact@v4` chỉ thấy artefact của **cùng một workflow run**. Artefact
      # `dist-<sha>` được "2. Build + artifact" upload ở một run khác, nên bước này chưa bao giờ
      # lấy được `dist/` trên runner — job chết ngay đây và `continue-on-error` che thành "success".
      # Build trực tiếp (~1 phút) đánh đổi bằng việc probe thật sự chạy được trên CI.
      - name: Build
        run: npm run build --silent

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: QA probe
        run: node qa/run-one.mjs "${{ github.event.inputs.probe || 'qa/golden-path.mjs' }}"

      # Log của một job Actions chỉ người có quyền admin mới tải được (`GET/…/jobs/<id>/logs` trả
      # `403 Must have admin rights to Repository`), nên lane đã ba lần thấy bước "QA probe" đỏ mà
      # không đọc nổi dòng lỗi. Kênh đọc được **đã đo**: annotation trả HTTP 200 không cần token
      # (`GET /repos/<o>/<r>/check-runs/125452831334/annotations` ⇒ 13 annotation), trong khi
      # `$GITHUB_STEP_SUMMARY` (bước 8 ở run 41494831619, chạy thành công) **không** hiện trong
      # `output.summary` của check-run ⇒ summary không phải kênh cho lane.
      # Bài học lần 1 (run 41496530836): `head -c 700` chép phần **đầu** JSON, mà `state` được khai
      # báo `{ steps, errors }` nên phần đầu là mảng `steps` — `errors`/`failedAt` nằm cuối và
      # không lọt vào, lại một `while read` mỗi dòng một annotation nên thứ tự bị xáo. Lần này cắt
      # đúng hai khối: tổng hợp `errors`/`failedAt`/tên bước, và đuôi log thô, mỗi khối **một**
      # annotation nối dòng bằng `%0A` để thứ tự không đổi nghĩa.
      # Không đổi code probe: chỉ làm nguyên nhân thật trở nên quan sát được.
      - name: Đưa lỗi probe lên annotation (đọc public được)
        if: failure()
        env:
          PROBE: ${{ github.event.inputs.probe || 'qa/golden-path.mjs' }}
        run: |
          node qa/run-one.mjs "$PROBE" > probe-run.log 2>&1 || true
          # Probe in JSON rồi mới in "QA FAIL" ra stderr; tách khối JSON cuối file để lấy errors.
          summ="$(node -e '
            const t = require("fs").readFileSync("probe-run.log", "utf8");
            const i = t.indexOf("{"), j = t.lastIndexOf("}");
            let o = null;
            if (i >= 0 && j > i) { try { o = JSON.parse(t.slice(i, j + 1)); } catch {} }
            const s = o
              ? JSON.stringify({ ok: o.ok, failedAt: o.failedAt, errors: o.errors,
                  lastSteps: (o.steps || []).map((x) => x.step).slice(-6) })
              : "NO_JSON " + t.slice(-500);
            process.stdout.write(s);
          ' || echo "DIAG_NODE_FAIL")"
          ctx="runner=$(uname -sr) node=$(node -v) npm=$(npm -v) playwright=$(npx playwright --version 2>&1 | head -1) dist_files=$(find dist -maxdepth 1 -type f 2>/dev/null | wc -l)"
          emit() {
            m="$1"
            m="${m//$'\r'/}"; m="${m//%/%25}"; m="${m//#/%23}"; m="${m//$'\n'/%0A}"
            echo "::error file=.github/workflows/03-qa-browser.yml,line=55::$PROBE :: ${m:0:1600}"
          }
          emit "$summ"
          emit "$(tail -c 900 probe-run.log) || $ctx"
